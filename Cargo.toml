[package]
name = "aliyun-oss"
version = "0.2.0"
edition = "2024"
authors = ["Leon <leon@leonrust.com>"]
description = "aliyun oss sdk"
license = "MIT"
readme = "README.md"
repository = "https://github.com/EchoRust/aliyun-oss"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
thiserror = "2"
http = "1"
bytes = "1"
async-trait = "0.1"
url = "2"
base64 = "0.22"
hmac = "0.13.0"
sha2 = "0.11.0"
hex = "0.4"
chrono = "0.4"
sha1 = "0.11.0"
serde = { version = "1", features = ["derive"] }
quick-xml = { version = "0.40.1", features = ["serialize"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = "0.13.3"

[dev-dependencies]
wiremock = "0.6"
